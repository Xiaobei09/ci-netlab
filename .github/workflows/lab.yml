name: relay-lab
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe | quota | capacity | direct | hotswap | shell'
        required: true
        default: probe
        type: choice
        options: [probe, quota, capacity, direct, hotswap, zengate, zengate-preflight, zengate-select, shell]
      relay:
        description: 'relay ip:port (blank = auto sample)'
        required: false
        default: ''
      count:
        description: 'relays to sample (probe/quota) or max client runs (capacity)'
        required: false
        default: '10'
      source:
        description: 'proxyip source file under data/valid/'
        required: false
        default: 'all.txt'
      rank:
        description: 'rank selection: 1 = high reputation + rare exit country'
        required: false
        default: '0'
      model:
        description: 'model for quota mode'
        required: false
        default: 'opencode/big-pickle'
      command:
        description: 'command for shell mode'
        required: false
        default: ''
      wait:
        description: 'seconds to wait after first non-success (reset test)'
        required: false
        default: '0'
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: https://raw.githubusercontent.com/Xiaobei09/proxyip/main
    steps:
      - uses: actions/checkout@v4

      - name: Network identity
        run: |
          set -uo pipefail
          mkdir -p /tmp/lab
          echo "v4: $(curl -4 -sS --max-time 10 https://icanhazip.com || true)"
          echo "v6: $(curl -6 -sS --max-time 10 https://icanhazip.com || true)"
          curl -sS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|colo|loc)=' || true

      - name: Probe relays
        if: inputs.mode == 'probe'
        env:
          COUNT: ${{ inputs.count }}
          SOURCE: ${{ inputs.source }}
        run: bash scripts/probe.sh

      - name: Quota test
        if: inputs.mode == 'quota'
        env:
          RELAY: ${{ inputs.relay }}
          MODEL: ${{ inputs.model }}
          SOURCE: ${{ inputs.source }}
          COUNT: ${{ inputs.count }}
          RANK: ${{ inputs.rank }}
        run: bash scripts/quota.sh

      - name: Capacity test
        if: inputs.mode == 'capacity'
        env:
          RELAY: ${{ inputs.relay }}
          MODEL: ${{ inputs.model }}
          SOURCE: ${{ inputs.source }}
          MAX_RUNS: ${{ inputs.count }}
          WAIT_SECONDS: ${{ inputs.wait }}
        run: bash scripts/capacity.sh

      - name: Direct capacity
        if: inputs.mode == 'direct'
        env:
          MODEL: ${{ inputs.model }}
          MAX_RUNS: ${{ inputs.count }}
          WAIT_SECONDS: ${{ inputs.wait }}
        run: bash scripts/direct_capacity.sh

      - name: Setup Node 24
        if: inputs.mode == 'zengate' || inputs.mode == 'zengate-preflight' || inputs.mode == 'zengate-select'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Zengate IP probe
        if: inputs.mode == 'zengate'
        env:
          COUNT: ${{ inputs.count }}
          SOURCE: ${{ inputs.source }}
          MODEL: ${{ inputs.model }}
        run: bash scripts/zengate-probe.sh

      - name: Zengate preflight test
        if: inputs.mode == 'zengate-preflight'
        env:
          COUNT: ${{ inputs.count }}
          SOURCE: ${{ inputs.source }}
        run: bash scripts/zengate-preflight-test.sh

      - name: Zengate select test
        if: inputs.mode == 'zengate-select'
        env:
          COUNT: ${{ inputs.count }}
        run: bash scripts/zengate-select-test.sh

      - name: Hotswap test
        if: inputs.mode == 'hotswap'
        env:
          RELAY: ${{ inputs.relay }}
          MODEL: ${{ inputs.model }}
          SOURCE: ${{ inputs.source }}
          COUNT: ${{ inputs.count }}
          RANK: ${{ inputs.rank }}
          SWITCH_DELAY: ${{ inputs.wait }}
        run: bash scripts/hotswap.sh

      - name: Shell
        if: inputs.mode == 'shell'
        env:
          COMMAND: ${{ inputs.command }}
        run: bash -c "$COMMAND"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-log-${{ github.run_id }}
          path: /tmp/lab/**
          if-no-files-found: ignore
